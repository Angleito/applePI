install_agent_hooks = ["pi"]

provider = "pi"
option_defaults = { model = "deepseek-v4-flash" }
scope = "rig"
work_dir = "{{.RigRoot}}"
min_active_sessions = 0
# max_active_sessions capped at 1 until automatic worktree isolation is
# implemented and validated. Multiple concurrent writing Workers inside
# one shared checkout would race on the same files.
# Raised after worktree isolation is validated.
max_active_sessions = 1
wake_mode = "fresh"

[env]
PI_SUBAGENT_ENABLED = "1"
PI_SUBAGENT_ALLOWED = "scout"
PI_SUBAGENT_MAX_RUNNING = "3"