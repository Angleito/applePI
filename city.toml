[workspace]
provider = "pi"

[agent_defaults]
provider = "pi"

[beads]
provider = "file"

# Role-based model choices on top of the builtin pi harness.
# Changing a model here is configuration, not architecture.
[providers.pi]
base = "builtin:pi"
options_schema_merge = "by_key"

[[providers.pi.options_schema]]
key = "model"
label = "Model"
type = "select"
default = "deepseek-v4-flash"

[[providers.pi.options_schema.choices]]
value = "deepseek-v4-flash"
label = "DeepSeek V4 Flash"
flag_args = ["--provider", "opencode-go", "--model", "deepseek-v4-flash"]

[[providers.pi.options_schema.choices]]
value = "deepseek-v4-pro"
label = "DeepSeek V4 Pro"
flag_args = ["--provider", "opencode-go", "--model", "deepseek-v4-pro"]

# [mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
# retention_ttl = "0"