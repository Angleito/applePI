[workspace]
provider = "pi"

[agent_defaults]
provider = "pi"

# Beads provider: unset = Gas City default "bd" (Dolt-backed).
# Do not set provider = "file": the file store cannot claim routed work
# (gastownhall/gascity#1761); all durable work queries require bd.

# Pi remains the agent runtime. The launcher selects its backend and model
# from the user's ignored .env file, never from committed credentials.
[providers.pi]
base = "builtin:pi"
command = "sh"
args = ["-c", "exec \"$GC_CITY/pi-launcher.sh\" \"$@\"", "pi-launcher"]

# [mail]
# retention_ttl controls how long read messages are retained before purge.
# 0 disables retention; use "168h" for 7 days.
# "7d" is not a valid Go duration.
# retention_ttl = "0"

[[rigs]]
name = "scratch-proj"
default_branch = "main"
# Reusable rig-scoped Manager/Worker templates (see packs/applepi-roles).
# The relative source resolves against the city root, so fresh clones of
# this repo get the same pack with no machine-specific paths.
[rigs.imports]
[rigs.imports.applepi-roles]
source = "packs/applepi-roles"
